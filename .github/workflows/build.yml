name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Generate platform folders
        working-directory: mobile
        run: flutter create --org com.hesabyar --project-name hesabyar_tanakhah .
      - name: Disable Impeller rendering workaround
        working-directory: mobile
        run: |
          sed -i 's#</application>#    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n</application>#' android/app/src/main/AndroidManifest.xml
      - name: Update Kotlin version
        working-directory: mobile
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle
      - name: Patch app compileSdk directly
        working-directory: mobile
        run: |
          sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.compileSdkVersion/compileSdk 34/' android/app/build.gradle
      - name:
